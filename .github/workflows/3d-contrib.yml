name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"      # daily, 00:00 UTC
  workflow_dispatch:          # manual run button

permissions:
  contents: write

concurrency:
  group: profile-assets       # serialises with the summary-cards workflow (both push to main)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "chore: update 3D contribution graph"; then
            git pull --rebase
            git push
          fi
